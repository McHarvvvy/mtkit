syntax = "proto3";

package loyalty;

option go_package = "shopdemo/api/loyaltypb";

// Loyalty 是玩具示例里的外部积分服务：SUT 出站调用它查某账号的积分。
// 集成测试用 mtkit 的 fake gRPC 替换它（见 test/fake/grpc/loyalty.go）。
service Loyalty {
  rpc GetPoints(GetPointsReq) returns (GetPointsRes) {}
}

message GetPointsReq {
  // account_id 用 string：fake 薄壳取它当 route_key（按用例分流）。
  string account_id = 1;
}

message GetPointsRes {
  int64 points = 1;
}
